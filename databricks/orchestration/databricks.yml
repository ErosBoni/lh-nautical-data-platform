bundle:
  name: orchestration
  uuid: f6b5dda6-47e0-4e97-8818-2ce1d40fcc1c

include:
  - resources/*.yml
  - ../../databricks.local.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use
  dev_schema:
    description: "Per-user dev schema (ex: pinho_analytics)"
    default: 'develop'

targets:
  dev:
    mode: development
    default: true
    variables:
      catalog: develop
      schema: ${var.dev_schema}
  # Replace <your-workspace> and <your-email> with your own workspace host and
  # workspace user before deploying to prod.
  prod:
    mode: production
    workspace:
      host: https://<your-workspace>.cloud.databricks.com
      root_path: /Workspace/Users/<your-email>/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: lh_nautical
      schema: prod
    permissions:
      - user_name: <your-email>
        level: CAN_MANAGE
